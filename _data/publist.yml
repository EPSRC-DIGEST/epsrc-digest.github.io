
- title: "The Impact of Grid Storage on Balancing Costs and Carbon Emissions in Great Britain"
  image: emissions_pub.png
  description: Grid energy storage can help to balance supply and demand, but its financial viability and operational carbon emissions impact is poorly understood because of the complexity of grid constraints and market outcomes. We analyse the impact of several technologies (Li-ion and flow batteries, pumped hydro, hydrogen) on Great Britain balancing mechanism, the main market for supply-demand balancing and congestion management. We find that, for many locations and technologies, financially optimal operation of storage for balancing can result in higher carbon emissions. For example, the extra emissions associated with a 1 MW 2-hour duration Li-ion battery in winter vary between +230 to -71 kgCO2/h. Although storage enable higher usage of renewables, it can also unlock additional demand leading to greater use of gas. In addition, balancing services alone are presently insufficient for financial viability of storage projects. This work highlights the need for market reform aligning financial incentives with environmental impacts.
  authors: <a href="https://scholar.google.com/citations?user=buMWpXoAAAAJ&hl=en">Nosratabadi, S.M.</a>, <a href="https://scholar.google.com/citations?user=3aXbtB4AAAAJ&hl=en">Savelli, I.</a>, <a href="https://scholar.google.com/citations?user=Z43mRIsAAAAJ&hl=en">Kumtepeli, V.</a>, <a href="https://scholar.google.com/citations?user=yXfmS6kAAAAJ&hl=en&oi=ao">Grunewald, P.</a>, <a href="https://scholar.google.com/citations?user=67Xru_kAAAAJ&hl=en">Aunedi, M.</a>, <a href="https://scholar.google.com/citations?user=6-MOqkMAAAAJ&hl=en">Howey, D.A.</a>, and <a href="https://scholar.google.com/citations?user=nvzgGIcAAAAJ&hl=en">Morstyn, T.</a>
  link:
    url: https://arxiv.org/abs/2410.07740
